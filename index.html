<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Weekly Food Plan V2</title><style>:root{--ink:#18322c;--muted:#6a736e;--cream:#f7f2e8;--card:#fffdf8;--sage:#dfe9df;--line:#ded8cd}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,system-ui,sans-serif}.app{max-width:680px;margin:auto;min-height:100vh;padding:20px}.hero{padding:22px 4px 10px}.hero h1{margin:4px 0}.muted{color:var(--muted);font-size:.9rem}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0}.weeknav{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}.centre{text-align:center}.day{transition:.15s}.day.drop-target{outline:2px solid var(--ink);background:#f0f5ef}.meal{border-top:1px solid var(--line);padding:12px 0;touch-action:pan-y;transition:opacity .15s,transform .15s}.meal[data-draggable="true"]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.meal.dragging{opacity:.32;touch-action:none}.drag-ghost{position:fixed;z-index:1000;pointer-events:none;margin:0;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card);box-shadow:0 12px 30px #0003;transform:translate(-50%,-50%) scale(1.02);max-width:min(420px,82vw);font-weight:750}.dragging-page,.dragging-page *{-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important}.dragging-page{overscroll-behavior:none}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.meal-main{display:flex;align-items:center;gap:11px;min-width:0;flex:1}.meal-copy{min-width:0}.complete{width:26px;height:26px;min-width:26px;border:2px solid #87938d;border-radius:50%;padding:0;background:transparent;display:grid;place-items:center;font-size:.9rem}.complete.checked{background:var(--ink);border-color:var(--ink);color:white}.menu{position:relative}.menu summary{list-style:none;cursor:pointer;font-size:1.45rem;line-height:1;padding:6px 7px;border-radius:10px}.menu summary::-webkit-details-marker{display:none}.menu-pop{position:absolute;right:0;z-index:5;min-width:130px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 8px 24px #0002}.menu-pop button{width:100%;text-align:left;background:transparent}.done{opacity:.58}.done .title{text-decoration:line-through}.drag-hint{font-size:.72rem;color:var(--muted);margin-top:4px}.pill{font-size:.72rem;background:var(--sage);padding:4px 8px;border-radius:999px}.login{margin-top:15vh}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;margin:10px 0}.hidden{display:none}.status{padding:10px 12px;border-radius:12px;background:var(--sage);margin:10px 0;font-size:.86rem}.shop label{display:grid;grid-template-columns:24px 1fr auto;gap:8px;padding:10px 0;border-top:1px solid var(--line)}nav{position:sticky;bottom:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px;background:rgba(247,242,232,.94);padding:8px;border-radius:16px}button,input{font:inherit}button{border:0;border-radius:12px;padding:9px 12px;font-weight:750;background:var(--sage);color:var(--ink)}button.primary{background:var(--ink);color:white}button:disabled{opacity:.35}</style></head><body><div class="app"><section id="login" class="login card"><h1>Weekly Food Plan</h1><div id="normalLogin"><p class="muted">Sign in with the email and password linked to your household.</p><input id="email" type="email" autocomplete="email" placeholder="Email address"><input id="password" type="password" autocomplete="current-password" placeholder="Password"><button class="primary" id="signIn">Sign in</button></div><div id="recovery" class="hidden"><p class="muted">Choose a new password for your Weekly Food Plan account.</p><input id="newPassword" type="password" autocomplete="new-password" minlength="8" placeholder="New password"><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" placeholder="Confirm new password"><button class="primary" id="savePassword">Save password</button></div><div id="loginStatus"></div></section><section id="main" class="hidden"><header class="hero"><div class="muted">Shared family menu · V2</div><h1>Weekly Food Plan</h1></header><div class="card weeknav"><button id="prevWeek">‹</button><div class="centre"><strong id="period"></strong><div><button id="todayWeek">Today</button></div></div><button id="nextWeek">›</button></div><div id="message"></div><main id="week"></main><section id="shop" class="hidden"><h2>Shopping</h2><div class="card shop" id="shopList"></div></section><nav><button id="weekTab" class="primary">Week</button><button id="shopTab">Shop</button></nav></section></div><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';import{SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY}from'./config.js';const db=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}}),$=id=>document.getElementById(id);let weeks=[],weekIndex=0,currentWeek=null,meals=[],recoveryMode=false,drag=null;function note(t){$('message').innerHTML=t?`<div class="status">${t}</div>`:''}function loginNote(t){$('loginStatus').innerHTML=t?`<div class="status">${t}</div>`:''}function fmt(d){return new Date(d+'T12:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}function today(){return new Date().toISOString().slice(0,10)}function showRecovery(){recoveryMode=true;$('normalLogin').classList.add('hidden');$('recovery').classList.remove('hidden');$('login').classList.remove('hidden');$('main').classList.add('hidden');loginNote('Recovery link accepted. Set your new password below.')}async function boot(){if(recoveryMode)return;const{data:{session}}=await db.auth.getSession();if(!session)return;$('login').classList.add('hidden');$('main').classList.remove('hidden');await loadWeeks()}$('signIn').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return loginNote('Enter your email address and password.');loginNote('Signing in…');const{data,error}=await db.auth.signInWithPassword({email,password});if(error)return loginNote(error.message);if(!data.session)return loginNote('Sign-in could not be completed.');loginNote('');await boot()};$('password').addEventListener('keydown',e=>{if(e.key==='Enter')$('signIn').click()});$('savePassword').onclick=async()=>{const password=$('newPassword').value,confirm=$('confirmPassword').value;if(password.length<8)return loginNote('Use at least 8 characters.');if(password!==confirm)return loginNote('The passwords do not match.');loginNote('Saving password…');const{error}=await db.auth.updateUser({password});if(error)return loginNote(error.message);recoveryMode=false;history.replaceState({},document.title,location.pathname);loginNote('Password saved. Loading your plan…');await boot()};db.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')showRecovery();else if(!recoveryMode)setTimeout(boot,0)});async function loadWeeks(){const{data:{user}}=await db.auth.getUser();const{data:members,error}=await db.from('household_users').select('household_id').eq('user_id',user.id).limit(1);if(error||!members?.length){note('Your account is signed in but is not linked to the household yet.');return}const hid=members[0].household_id,r=await db.from('weeks').select('*').eq('household_id',hid).order('start_date',{ascending:true});weeks=r.data||[];if(!weeks.length){note('There are no V2 weeks yet.');return}const t=today();let i=weeks.findIndex(w=>w.start_date<=t&&w.end_date>=t);if(i<0)i=weeks.findIndex(w=>w.status==='current');weekIndex=i<0?weeks.length-1:i;await selectWeek(weekIndex)}async function selectWeek(i){if(i<0||i>=weeks.length)return;weekIndex=i;currentWeek=weeks[i];$('period').textContent=`${fmt(currentWeek.start_date)} – ${fmt(currentWeek.end_date)}`;$('prevWeek').disabled=i===0;$('nextWeek').disabled=i===weeks.length-1;const r=await db.from('meals').select('id,meal_key,meal_date,scheduled_date,slot,title,meal_mode,source_meal_id,execution_status').eq('week_id',currentWeek.id).order('scheduled_date').order('slot');meals=r.data||[];renderWeek();await renderShop()}function editable(){return currentWeek?.status==='current'}function renderWeek(){const by={};meals.forEach(m=>(by[m.scheduled_date]??=[]).push(m));const dates=[];for(let d=new Date(currentWeek.start_date+'T12:00');d<=new Date(currentWeek.end_date+'T12:00');d.setDate(d.getDate()+1))dates.push(d.toISOString().slice(0,10));$('week').innerHTML=dates.map(date=>`<div class="card day" data-date="${date}"><h3>${fmt(date)}</h3>${(by[date]||[]).map(m=>{const done=m.execution_status==='done',linked=m.meal_mode==='planned_leftover',canDrag=editable()&&!linked&&m.execution_status==='upcoming';return `<div class="meal ${done?'done':''}" data-meal="${m.id}" ${canDrag?'data-draggable="true"':''}><div class="row"><div class="meal-main">${editable()?`<button class="complete ${done?'checked':''}" aria-label="${done?'Mark not completed':'Mark completed'}" onclick="event.stopPropagation();${done?`reopenMeal('${m.id}')`:`doneMeal('${m.id}')`}">${done?'✓':''}</button>`:''}<div class="meal-copy"><strong class="title">${m.title}</strong><div class="muted">${m.slot}${linked?' · linked lunch':''}</div>${canDrag?'<div class="drag-hint">Hold and drag to move</div>':''}</div></div>${editable()?`<details class="menu"><summary aria-label="More options">⋯</summary><div class="menu-pop">${m.execution_status==='upcoming'?`<button onclick="skipMeal('${m.id}')">Skip meal</button>`:`<button onclick="reopenMeal('${m.id}')">Reopen</button>`}</div></details>`:`<span class="pill">${m.execution_status}</span>`}</div></div>`}).join('')||'<div class="muted">No meals</div>'}</div>`).join('');bindDrag()}async function statusMeal(id,status){const{error}=await db.rpc('set_meal_status',{target_meal_id:id,new_status:status,note:null});if(error)return note(error.message);await selectWeek(weekIndex)}window.doneMeal=id=>statusMeal(id,'done');window.skipMeal=id=>statusMeal(id,'skipped');window.reopenMeal=id=>statusMeal(id,'upcoming');async function commitMove(id,target){const m=meals.find(x=>x.id===id);if(!m||target===m.scheduled_date)return;note('Moving meal…');const{error}=await db.rpc('move_meal',{target_meal_id:id,target_date:target});if(error)return note(error.message);note('Meal moved. Any linked lunch moved with its source meal.');await selectWeek(weekIndex)}function dayAt(x,y){const ghost=drag?.ghost;if(ghost)ghost.style.visibility='hidden';const day=document.elementFromPoint(x,y)?.closest('.day');if(ghost)ghost.style.visibility='visible';return day}function paintDrag(x,y){if(!drag?.active)return;if(drag.ghost){drag.ghost.style.left=x+'px';drag.ghost.style.top=y+'px'}document.querySelectorAll('.drop-target').forEach(n=>n.classList.remove('drop-target'));const day=dayAt(x,y);drag.target=day?.dataset.date||null;if(day)day.classList.add('drop-target')}function activateDrag(state){if(drag!==state)return;state.active=true;document.body.classList.add('dragging-page');state.el.classList.add('dragging');const ghost=document.createElement('div');ghost.className='drag-ghost';ghost.textContent=state.title;document.body.appendChild(ghost);state.ghost=ghost;paintDrag(state.lastX,state.lastY);navigator.vibrate?.(25)}function clearDrag(){if(!drag)return;clearTimeout(drag.timer);drag.el?.classList.remove('dragging');drag.ghost?.remove();document.body.classList.remove('dragging-page');document.querySelectorAll('.drop-target').forEach(n=>n.classList.remove('drop-target'));drag=null}async function finishDrag(){if(!drag)return;const active=drag.active,target=drag.target,id=drag.id;clearDrag();if(active&&target)await commitMove(id,target)}function bindDrag(){document.querySelectorAll('[data-draggable="true"]').forEach(el=>{el.oncontextmenu=e=>e.preventDefault();el.onselectstart=e=>e.preventDefault();el.onpointerdown=e=>{if(e.target.closest('button,details,summary'))return;if(e.pointerType==='mouse'&&e.button!==0)return;const m=meals.find(x=>x.id===el.dataset.meal);drag={el,id:el.dataset.meal,title:m?.title||'Meal',pointerId:e.pointerId,startX:e.clientX,startY:e.clientY,lastX:e.clientX,lastY:e.clientY,active:false,target:null,timer:setTimeout(()=>activateDrag(drag),280)}})}document.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.pointerId)return;drag.lastX=e.clientX;drag.lastY=e.clientY;if(!drag.active){if(Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)>10)clearDrag();return}e.preventDefault();paintDrag(e.clientX,e.clientY)},{passive:false});document.addEventListener('pointerup',e=>{if(drag&&e.pointerId===drag.pointerId)finishDrag()});document.addEventListener('pointercancel',e=>{if(drag&&e.pointerId===drag.pointerId)clearDrag()});document.addEventListener('touchmove',e=>{if(drag?.active)e.preventDefault()},{passive:false});async function renderShop(){const{data}=await db.from('shopping_items').select('id,name,quantity,unit,purchased').eq('week_id',currentWeek.id).order('name');$('shopList').innerHTML=(data||[]).map(x=>`<label><input type="checkbox" ${x.purchased?'checked':''} ${editable()?'':'disabled'} onchange="toggleShop('${x.id}',this.checked)"><span>${x.name}</span><span class="muted">${x.quantity} ${x.unit}</span></label>`).join('')||'<div class="muted">No shopping items.</div>'}window.toggleShop=async(id,v)=>{if(!editable())return;const{error}=await db.from('shopping_items').update({purchased:v,purchased_at:v?new Date().toISOString():null}).eq('id',id);if(error)note(error.message)};$('prevWeek').onclick=()=>selectWeek(weekIndex-1);$('nextWeek').onclick=()=>selectWeek(weekIndex+1);$('todayWeek').onclick=()=>{const t=today(),i=weeks.findIndex(w=>w.start_date<=t&&w.end_date>=t);if(i>=0)selectWeek(i)};$('weekTab').onclick=()=>{$('week').classList.remove('hidden');$('shop').classList.add('hidden');$('weekTab').classList.add('primary');$('shopTab').classList.remove('primary')};$('shopTab').onclick=()=>{$('week').classList.add('hidden');$('shop').classList.remove('hidden');$('shopTab').classList.add('primary');$('weekTab').classList.remove('primary')};boot();</script></body></html>
